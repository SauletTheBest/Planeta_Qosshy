<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Car List</title>
</head>
<body>
<h1>Admin - Car List</h1>
<a href="/admin/cars/new">Add New Car</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Brand</th>
        <th>Model</th>
        <th>Year</th>
        <th>Price</th>
        <th>Mileage</th>
        <th>Image URL</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    {{range .cars}}
    <tr>
        <td>{{.ID}}</td>
        <td>{{.Brand}}</td>
        <td>{{.Model}}</td>
        <td>{{.Year}}</td>
        <td>${{printf "%.2f" .Price}}</td>
        <td>{{.Mileage}} miles</td>
        <td><a href="{{.ImageURL}}" target="_blank">View Image</a></td>
        <td>
            <a href="/admin/cars/{{.ID}}/edit">Edit</a>
            <form action="/admin/cars/{{.ID}}/delete" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this car?');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {{end}}
    </tbody>
</table>

<p><a href="/">Back to Home</a></p>
</body>
</html>
