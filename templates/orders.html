<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Orders</title>
</head>
<body>
<h1>Your Purchased Clothes</h1>
<a href="/clothes"><button>Back to Catalog</button></a>
<ul>
    {{range .orders}}
    <li>
        <strong>{{.Clothes.Title}}</strong> - {{.Clothes.Brand}} (Size: {{.Clothes.Size}}, Color: {{.Clothes.Color}}) | Price: ${{printf "%.2f" .Clothes.Price}} | Date: {{.CreatedAt.Format "Jan 02, 2006"}}
    </li>
    {{else}}
    <p>No orders placed yet.</p>
    {{end}}
</ul>
</body>
</html>
