<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Planeta Qosshy</title>
  <link rel="icon" type="image/png" href="/static/image/earth.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="/static/image/earth.png" type="image/png">
</head>
<body>
<header class="header">
  <a href="/" class="logo">PLANETA QOSSHY</a>
  <nav class="nav">
    <a href="/">Главная</a>
    <a href="/clothes">Каталог</a>
  </nav>
  <div class="header-actions">
    <a href="/auth/register" class="btn btn-outline">Регистрация</a>
  </div>
</header>
<div class="auth-page">
  <div class="auth-card">
    <a href="/" class="logo-center">PLANETA QOSSHY</a>
    <h2>Добро пожаловать</h2>
    {{if .verified}}<div class="alert alert-success">✅ Email подтверждён! Теперь вы можете войти.</div>{{end}}
    {{if .error}}<div class="alert alert-error">{{.error}}</div>{{end}}
    <form action="/auth/login" method="POST">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>
    <p class="form-hint">Нет аккаунта? <a href="/auth/register">Зарегистрируйтесь</a></p>
  </div>
</div>
<footer class="footer">
  <div class="footer-bottom"><p>&copy; 2026 PLANETA QOSSHY. Все права защищены.</p></div>
</footer>
</body>
</html>
