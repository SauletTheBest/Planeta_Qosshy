<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новый пароль — Planeta Qosshy</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="/static/image/earth.png" type="image/png">
  <!-- The token is in this page's URL: don't send it to other sites in the Referer header. -->
  <meta name="referrer" content="no-referrer">
</head>
<body>
<header class="header">
  <a href="/" class="logo">PLANETA QOSSHY</a>
  <nav class="nav">
    <a href="/">Главная</a>
    <a href="/clothes">Каталог</a>
  </nav>
</header>
<div class="auth-page">
  <div class="auth-card">
    <a href="/" class="logo-center">PLANETA QOSSHY</a>
    <h2>Новый пароль</h2>
    {{if .error}}<div class="alert alert-error">{{.error}}</div>{{end}}
    <form action="/auth/reset" method="POST">
      <input type="hidden" name="token" value="{{.token}}">
      <div class="form-group">
        <label for="password">Новый пароль</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required />
      </div>
      <div class="form-group">
        <label for="password2">Ещё раз</label>
        <input type="password" id="password2" name="password2" autocomplete="new-password" minlength="8" maxlength="72" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Сохранить пароль</button>
    </form>
    <p class="form-hint" style="font-size:.85rem;">После смены пароля все устройства, где вы входили в аккаунт, будут из него выведены.</p>
  </div>
</div>
<footer class="footer">
  <div class="footer-bottom"><p>&copy; 2026 PLANETA QOSSHY. Все права защищены.</p></div>
</footer>
</body>
</html>
