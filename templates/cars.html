<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Listings</title>
</head>
<body>
<button onclick="logout()">Logout</button>

<a href="/profile">
  <button>Profile</button>
</a>
<h1>Car Listings</h1>

<!-- Filtering and Sorting Form -->
<form method="GET" action="/cars">
  <!-- Filtering Fields -->
  <label for="brand">Brand:</label>
  <input type="text" id="brand" name="brand" value="{{.brand}}">

  <label for="model">Model:</label>
  <input type="text" id="model" name="model" value="{{.model}}">

  <label for="year">Year:</label>
  <input type="number" id="year" name="year" value="{{.year}}">

  <label for="min_price">Min Price:</label>
  <input type="number" id="min_price" name="min_price" value="{{.min_price}}">

  <label for="max_price">Max Price:</label>
  <input type="number" id="max_price" name="max_price" value="{{.max_price}}">

  <!-- Sorting Dropdown -->
  <label for="sort">Sort By:</label>
  <select id="sort" name="sort">
    <option value="">-- Select --</option>
    <option value="price_asc" {{if eq .sort "price_asc"}}selected{{end}}>Price: Low to High</option>
    <option value="price_desc" {{if eq .sort "price_desc"}}selected{{end}}>Price: High to Low</option>
    <option value="year_asc" {{if eq .sort "year_asc"}}selected{{end}}>Year: Oldest to Newest</option>
    <option value="year_desc" {{if eq .sort "year_desc"}}selected{{end}}>Year: Newest to Oldest</option>
  </select>

  <button type="submit">Apply Filters and Sort</button>
</form>

<!-- Car List -->
<table border="1">
  <thead>
  <tr>
    <th>Brand</th>
    <th>Model</th>
    <th>Year</th>
    <th>Price</th>
    <th></th>
  </tr>
  </thead>
  <tbody>
  {{range .cars}}
  <tr>
    <td>{{.Brand}}</td>
    <td>{{.Model}}</td>
    <td>{{.Year}}</td>
    <td>{{.Price}}</td>
    <td><a href="/cars/{{.ID}}">View this car</a></td>
  </tr>
  {{end}}
  </tbody>
</table>

<!-- Pagination -->
<div>
  {{if gt .page 1}}
  <a href="/cars?page={{sub .page 1}}&limit={{.limit}}&brand={{.brand}}&model={{.model}}&year={{.year}}&min_price={{.min_price}}&max_price={{.max_price}}&sort={{.sort}}">Previous</a>
  {{end}}

  <span>Page {{.page}} of {{ceil (div .totalCars .limit)}}</span>

  {{if lt (mul .page .limit) .totalCars}}
  <a href="/cars?page={{add .page 1}}&limit={{.limit}}&brand={{.brand}}&model={{.model}}&year={{.year}}&min_price={{.min_price}}&max_price={{.max_price}}&sort={{.sort}}">Next</a>
  {{end}}

</div>
</body>

<script>
  function logout() {
    fetch('/auth/logout', {
      method: 'POST',
      credentials: 'same-origin'
    })
            .then(response => {
              if (response.ok) {
                window.location.href = '/auth/login';
              } else {
                alert('Failed to logout');
              }
            })
            .catch(error => console.error('Error:', error));
  }
</script>
</html>
