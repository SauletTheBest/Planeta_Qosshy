<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .car}}Edit Car{{else}}Add New Car{{end}}</title>
</head>
<body>
<h1>{{if .car}}Edit Car{{else}}Add New Car{{end}}</h1>

{{if .error}}
<p style="color: red;">{{.error}}</p>
{{end}}

<form action="{{.action}}" method="POST">
    <label for="Brand">Brand:</label>
    <input type="text" id="brand" name="Brand" value="{{if .car}}{{.car.Brand}}{{end}}" required><br>

    <label for="Model">Model:</label>
    <input type="text" id="model" name="Model" value="{{if .car}}{{.car.Model}}{{end}}" required><br>

    <label for="Year">Year:</label>
    <input type="number" id="year" name="Year" value="{{if .car}}{{.car.Year}}{{end}}" required><br>

    <label for="Price">Price:</label>
    <input type="number" id="price" name="Price" step="0.01" value="{{if .car}}{{.car.Price}}{{end}}" required><br>

    <label for="Mileage">Mileage:</label>
    <input type="number" id="mileage" name="Mileage" value="{{if .car}}{{.car.Mileage}}{{end}}"><br>

    <label for="Image_URL">Image URL:</label>
    <input type="url" id="image_url" name="Image_URL" value="{{if .car}}{{.car.ImageURL}}{{end}}"><br>

    <button type="submit">{{if .car}}Update{{else}}Add{{end}} Car</button>
</form>

<p><a href="/admin/cars">Back to Car List</a></p>
</body>
</html>
