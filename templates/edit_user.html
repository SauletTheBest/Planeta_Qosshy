<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование профиля — Planeta Qosshy</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="/static/image/earth.png" type="image/png">
</head>
<body>
<header class="header">
  <a href="/" class="logo">PLANETA QOSSHY</a>
  <nav class="nav">
    <a href="/">Главная</a>
    <a href="/clothes">Каталог</a>
    <a href="/orders">Мои заказы</a>
    <a href="/profile" class="active">Профиль</a>
  </nav>
  <div class="header-actions">
    <a href="/auth/logout" class="btn btn-ghost">Выйти</a>
  </div>
</header>
<div class="auth-page">
  <div class="auth-card" style="max-width:500px;">
    <h2>Редактировать профиль</h2>
    {{if .error}}<div class="alert alert-error">{{.error}}</div>{{end}}
    <form action="/profile/edit/{{.user.ID}}" method="POST">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" value="{{.user.Username}}" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.user.Email}}" required>
      </div>
      <div class="form-group">
        <label for="password">Новый пароль</label>
        <input type="password" id="password" name="password" placeholder="Оставьте пустым, чтобы не менять" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Сохранить изменения</button>
    </form>
    <div style="margin-top:14px;text-align:center;">
      <a href="/profile" class="btn btn-ghost">← Отмена</a>
    </div>
  </div>
</div>
<footer class="footer">
  <div class="footer-bottom"><p>&copy; 2026 PLANETA QOSSHY. Все права защищены.</p></div>
</footer>
</body>
</html>
