<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Planeta Qosshy</title>
</head>
<body>
<h1>Checkout: {{.item.Title}}</h1>
<p>Total Price: <strong>${{printf "%.2f" .amount}}</strong></p>

<form action="/orders/{{.clothesID}}" method="POST">
  <label for="card_name">Cardholder Name:</label><br>
  <input type="text" id="card_name" name="card_name" required><br><br>

  <label for="card_number">Card Number:</label><br>
  <input type="text" id="card_number" name="card_number" maxlength="19" placeholder="1234 5678 9012 3456" required oninput="this.value = this.value.replace(/\D/g, '').replace(/(\d{4})/g, '$1 ').trim();"><br><br>

  <label for="expiry_date">Expiry Date (MM/YY):</label><br>
  <input type="text" id="expiry_date" name="expiry_date" maxlength="5" placeholder="MM/YY" required oninput="formatExpiryDate(this)"><br><br>

  <label for="cvv">CVV:</label><br>
  <input type="text" id="cvv" name="cvv" maxlength="3" required oninput="this.value = this.value.replace(/\D/g, '');"><br><br>

  <input type="hidden" id="user_id" name="user_id" value="{{.userID}}">
  <input type="hidden" id="clothes_id" name="clothes_id" value="{{.clothesID}}">
  <input type="hidden" id="amount" name="amount" value="{{.amount}}">

  <button type="submit">Pay ${{printf "%.2f" .amount}}</button>
</form>

<br>
<a href="/clothes"><button>Cancel</button></a>
</body>

<script>
  function formatExpiryDate(input) {
    let value = input.value.replace(/\D/g, '');
    if (value.length > 2) {
      value = value.substring(0, 2) + '/' + value.substring(2, 4);
    }
    input.value = value.substring(0, 5);
  }
</script>
</html>
