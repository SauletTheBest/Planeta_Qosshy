<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поддержка — Planeta Qosshy</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="/static/image/earth.png" type="image/png">
</head>
<body>
{{template "site_header" .}}
<div class="auth-page">
  <div class="auth-card" style="max-width:520px;">
    <h2>Написать в поддержку</h2>
    <p style="text-align:center;color:#666;margin-bottom:24px;font-size:.9rem;">
      Есть вопрос или проблема? Заполните форму, и мы свяжемся с вами.
    </p>
    {{if .error}}<div class="alert alert-error">{{.error}}</div>{{end}}
    {{if .success}}<div class="alert alert-success">{{.success}}</div>{{end}}
    <form action="/helpdesk/send" method="POST" enctype="multipart/form-data">
      <p style="font-size:.85rem;color:#666;margin-bottom:16px;">Ответ придёт на <strong>{{.email}}</strong> — email вашего аккаунта.</p>
      <div class="form-group">
        <label for="subject">Тема</label>
        <input type="text" id="subject" name="subject" maxlength="150" value="{{.subject}}" placeholder="Как мы можем помочь?" required>
      </div>
      <div class="form-group">
        <label for="message">Сообщение</label>
        <textarea id="message" name="message" rows="5" maxlength="5000" placeholder="Опишите вашу проблему..." required>{{.message}}</textarea>
      </div>
      <div class="form-group">
        <label for="attachments">Вложения (необязательно): до 3 файлов JPG, PNG или PDF, до 5 МБ каждый</label>
        <input type="file" id="attachments" name="attachments" multiple accept=".jpg,.jpeg,.png,.pdf">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Отправить сообщение</button>
    </form>
    <div style="margin-top:14px;text-align:center;">
      <a href="/profile" class="btn btn-ghost">← Назад в профиль</a>
    </div>
  </div>
</div>
{{template "site_footer" .}}
</body>
</html>
