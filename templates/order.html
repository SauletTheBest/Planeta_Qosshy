<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заказ оформлен — Planeta Qosshy</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="/static/image/earth.png" type="image/png">
</head>
<body>
{{template "site_header" .}}
<div class="message-page">
  <div class="message-card">
    <div class="icon">✅</div>
    <h2>Заказ оформлен!</h2>
    <p>Спасибо за покупку. Ваш заказ успешно обработан.<br>Статус: <strong>{{.Status}}</strong></p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="/orders" class="btn btn-primary">Мои заказы</a>
      <a href="/clothes" class="btn btn-ghost">Продолжить покупки</a>
    </div>
  </div>
</div>
{{template "site_footer" .}}
</body>
</html>
