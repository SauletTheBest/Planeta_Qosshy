<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Clothes Inventory</title>
</head>
<body>
<h1>Admin - Clothes Inventory</h1>
<a href="/admin/clothes/new">Add New Item</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Brand</th>
        <th>Category</th>
        <th>Size</th>
        <th>Color</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    {{range .items}}
    <tr>
        <td>{{.ID}}</td>
        <td>{{.Title}}</td>
        <td>{{.Brand}}</td>
        <td>{{.Category}}</td>
        <td>{{.Size}}</td>
        <td>{{.Color}}</td>
        <td>${{printf "%.2f" .Price}}</td>
        <td>{{.Stock}}</td>
        <td>
            <a href="/admin/clothes/{{.ID}}/edit">Edit</a>
            <form action="/admin/clothes/{{.ID}}/delete" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this item?');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {{end}}
    </tbody>
</table>

<p><a href="/admin">Back to Admin Dashboard</a></p>
</body>
</html>
