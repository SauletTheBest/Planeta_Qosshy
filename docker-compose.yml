version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: planeta_qosshy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: planeta_qosshy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planeta_qosshy"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planeta_qosshy_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=host=postgres port=5432 user=postgres password=postgrespassword dbname=planeta_qosshy sslmode=disable
      - COOKIE_SECRET=hqoirkqd
      - VERIFICATION_ADDRESS=http://localhost:8080
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
      - STRIPE_SECRET_KEY=sk_test_yourkey
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
