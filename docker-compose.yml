# (no "version:" line: Docker Compose v2 ignores it and warns)
services:
  postgres:
    image: postgres:16-alpine
    container_name: planeta_qosshy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Secrets come from the .env file next to this compose file (see .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: planeta_qosshy
    ports:
      # 127.0.0.1 = reachable only from this computer, not from the whole network.
      # POSTGRES_HOST_PORT: change it if 5432 is taken (e.g. by a PostgreSQL installed in
      # Windows). The shop itself doesn't use this port: it reaches "postgres" inside Docker.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planeta_qosshy"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planeta_qosshy_api
    restart: always
    # Docker waits this long after SIGTERM before killing; the app needs at most 9 s.
    stop_grace_period: 15s
    ports:
      # SHOP_PORT: change it if 8080 is taken by another project on this computer
      # (then also set PUBLIC_URL=http://localhost:<that port> in .env).
      - "${SHOP_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=host=postgres port=5432 user=postgres password=${POSTGRES_PASSWORD} dbname=planeta_qosshy sslmode=disable
      - COOKIE_SECRET=${COOKIE_SECRET:?set COOKIE_SECRET in .env}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - VERIFICATION_ADDRESS=${VERIFICATION_ADDRESS:-http://localhost:${SHOP_PORT:-8080}}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      - SHOP_TIMEZONE=${SHOP_TIMEZONE:-Asia/Almaty}
      # Containers reach each other by service name ("payments"), browsers use localhost.
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:${SHOP_PORT:-8080}}
      - PAYMENT_API_URL=http://payments:8081
      - PAYMENT_API_KEY=${PAYMENT_API_KEY:?set PAYMENT_API_KEY in .env}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
      - ORDER_RESERVATION_TTL=${ORDER_RESERVATION_TTL:-15m}
      - UPLOAD_DIR=/app/uploads
      # Order events go to Kafka through the outbox. The shop does NOT wait for Kafka at
      # startup: while it is down, events pile up in outbox_events and go out later.
      - KAFKA_BROKERS=kafka:29092
    volumes:
      # Product photos from the admin panel live outside the container,
      # so rebuilding the image doesn't delete them.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      payments:
        condition: service_healthy   # its Dockerfile HEALTHCHECK answers on /healthz

  # Qosshy Pay — the test bank. Its code is the planeta_qosshy_microservice repository,
  # which must be cloned next to this one (../planeta_qosshy_microservice).
  payments:
    build:
      context: ../planeta_qosshy_microservice
    container_name: planeta_qosshy_payments
    restart: always
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${BANK_PORT:-8081}:8081"   # the buyer's browser opens the payment page here
    environment:
      - PUBLIC_URL=http://localhost:${BANK_PORT:-8081}
      - API_KEY=${PAYMENT_API_KEY:?set PAYMENT_API_KEY in .env}
      - WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
      - MERCHANT_WEBHOOK_URL=http://api:8080/payments/webhook
      - MERCHANT_SITE_URL=${PUBLIC_URL:-http://localhost:${SHOP_PORT:-8080}}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      # Payments and PDF receipts survive a restart of the bank container.
      - bank_data:/app/data
      - receipts:/app/receipts

  # Mail trap for development: every letter (confirmation, password reset, receipts,
  # helpdesk) shows up at http://localhost:8025 and nothing is really sent.
  # Starts only on request:  docker compose --profile dev up   (and SMTP_HOST=mailpit in .env)
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: planeta_qosshy_mailpit
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"   # web UI; SMTP (1025) is reachable only inside Docker

  # Kafka: one broker in KRaft mode (it is its own controller, no ZooKeeper).
  # The shop writes order events to it (see outbox/), the notifier reads them.
  kafka:
    image: apache/kafka:3.9.0
    container_name: planeta_qosshy_kafka
    restart: unless-stopped
    ports:
      # For programs started on this computer (go run, kcat). Containers use kafka:29092.
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: planeta-qosshy-kafka-1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two doors for clients + one for the controller. A client first connects to any
      # door, then Kafka tells it the ADVERTISED address to use from now on, so each door
      # must advertise an address that works from where its clients are:
      #   INTERNAL  kafka:29092     — other containers (api, notifier, kafka-ui)
      #   EXTERNAL  localhost:9092  — this computer (published port above)
      # ":29092" (empty host) = listen on every interface. Not "0.0.0.0": Kafka derives the
      # controller's advertised address from here and refuses the meta-address 0.0.0.0.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Data goes to the volume below. Without this the image writes to
      # /tmp/kraft-combined-logs inside the container and everything is lost on re-create.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created on purpose (kafka-init), never by a typo in a topic name.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # One broker = one copy of everything (a real cluster has 3 brokers and factor 3).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Java takes as much memory as it is allowed to; 256 MB is plenty for a dev stand.
      # Kafka's own tools (kafka-topics.sh…) read this too: run them inside this container
      # with  docker exec -e KAFKA_HEAP_OPTS=-Xmx96m …  or they compete with the broker.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    mem_limit: 1g
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # "Is the client port open?" — cheap; a kafka-*.sh tool would start a whole JVM.
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Creates the topics once and exits. Running it again is harmless (--if-not-exists).
  #   3 partitions: up to 3 notifier copies could read in parallel; events of one order
  #   always land in the same partition (message key = order id), so they stay in order.
  #   retention 7 days: Kafka is a log, not a database — old messages are deleted.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: planeta_qosshy_kafka_init
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic shop.order-events --partitions 3 --replication-factor 1 \
            --config retention.ms=604800000 && exit 0
          echo "kafka is not ready yet ($$i/30)"; sleep 2
        done
        exit 1
    environment:
      KAFKA_HEAP_OPTS: "-Xmx128m"
    depends_on:
      kafka:
        condition: service_healthy

  # Reads order events from Kafka and emails the customer (cmd/notifier).
  # The same image as the shop, another program in it.
  notifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planeta_qosshy_notifier
    restart: unless-stopped
    command: ["./notifier"]
    healthcheck:
      disable: true   # the image's check asks the shop's /healthz; the notifier has no web port
    environment:
      - DATABASE_URL=host=postgres port=5432 user=postgres password=${POSTGRES_PASSWORD} dbname=planeta_qosshy sslmode=disable
      - KAFKA_BROKERS=kafka:29092
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:${SHOP_PORT:-8080}}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    mem_limit: 128m
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy   # the shop runs the migrations (the notifier's table)

  # Web UI for Kafka: topics, partitions, messages, consumer groups and their lag.
  # http://localhost:8085 — starts with the "dev" profile, like mailpit.
  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    container_name: planeta_qosshy_kafka_ui
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: planeta-qosshy
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "-Xmx256m"
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
  uploads:
  bank_data:
  receipts:
