# (no "version:" line: Docker Compose v2 ignores it and warns)
services:
  postgres:
    image: postgres:16-alpine
    container_name: planeta_qosshy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Secrets come from the .env file next to this compose file (see .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: planeta_qosshy
    ports:
      # 127.0.0.1 = reachable only from this computer, not from the whole network.
      # POSTGRES_HOST_PORT: change it if 5432 is taken (e.g. by a PostgreSQL installed in
      # Windows). The shop itself doesn't use this port: it reaches "postgres" inside Docker.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planeta_qosshy"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planeta_qosshy_api
    restart: always
    # Docker waits this long after SIGTERM before killing; the app needs at most 9 s.
    stop_grace_period: 15s
    ports:
      # SHOP_PORT: change it if 8080 is taken by another project on this computer
      # (then also set PUBLIC_URL=http://localhost:<that port> in .env).
      - "${SHOP_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=host=postgres port=5432 user=postgres password=${POSTGRES_PASSWORD} dbname=planeta_qosshy sslmode=disable
      - COOKIE_SECRET=${COOKIE_SECRET:?set COOKIE_SECRET in .env}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - VERIFICATION_ADDRESS=${VERIFICATION_ADDRESS:-http://localhost:${SHOP_PORT:-8080}}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      - SHOP_TIMEZONE=${SHOP_TIMEZONE:-Asia/Almaty}
      # Containers reach each other by service name ("payments"), browsers use localhost.
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:${SHOP_PORT:-8080}}
      - PAYMENT_API_URL=http://payments:8081
      - PAYMENT_API_KEY=${PAYMENT_API_KEY:?set PAYMENT_API_KEY in .env}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
      - ORDER_RESERVATION_TTL=${ORDER_RESERVATION_TTL:-15m}
      - UPLOAD_DIR=/app/uploads
    volumes:
      # Product photos from the admin panel live outside the container,
      # so rebuilding the image doesn't delete them.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      payments:
        condition: service_healthy   # its Dockerfile HEALTHCHECK answers on /healthz

  # Qosshy Pay — the test bank. Its code is the planeta_qosshy_microservice repository,
  # which must be cloned next to this one (../planeta_qosshy_microservice).
  payments:
    build:
      context: ../planeta_qosshy_microservice
    container_name: planeta_qosshy_payments
    restart: always
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${BANK_PORT:-8081}:8081"   # the buyer's browser opens the payment page here
    environment:
      - PUBLIC_URL=http://localhost:${BANK_PORT:-8081}
      - API_KEY=${PAYMENT_API_KEY:?set PAYMENT_API_KEY in .env}
      - WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
      - MERCHANT_WEBHOOK_URL=http://api:8080/payments/webhook
      - MERCHANT_SITE_URL=${PUBLIC_URL:-http://localhost:${SHOP_PORT:-8080}}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      # Payments and PDF receipts survive a restart of the bank container.
      - bank_data:/app/data
      - receipts:/app/receipts

  # Mail trap for development: every letter (confirmation, password reset, receipts,
  # helpdesk) shows up at http://localhost:8025 and nothing is really sent.
  # Starts only on request:  docker compose --profile dev up   (and SMTP_HOST=mailpit in .env)
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: planeta_qosshy_mailpit
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"   # web UI; SMTP (1025) is reachable only inside Docker

  kafka:
    image: apache/kafka:latest
    container_name: planeta_qosshy_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8085:8080" 
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

volumes:
  postgres_data:
  kafka_data:
  uploads:
  bank_data:
  receipts:
